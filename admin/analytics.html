<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics - GameGuides Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h2>GameGuides</h2>
    <p>Admin Panel</p>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html"><span class="icon">&#9632;</span> <span>Dashboard</span></a>
    <a href="content.html"><span class="icon">&#9776;</span> <span>Content</span></a>
    <a href="analytics.html" class="active"><span class="icon">&#9733;</span> <span>Analytics</span></a>
    <a href="feedback.html"><span class="icon">&#9993;</span> <span>Feedback</span></a>
    <a href="../index.html" target="_blank"><span class="icon">&#8599;</span> <span>View Site</span></a>
  </nav>
  <div class="sidebar-footer">
    &copy; 2026 GameGuides<br>
    <a href="../index.html">gameguides-4t7.pages.dev</a>
  </div>
</aside>

<main class="main-content">
  <div class="page-header">
    <h1>Analytics</h1>
    <p>Site performance and traffic insights (simulated data).</p>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="card">
    <div class="card-header"><h3>Top Pages by Views</h3></div>
    <div class="card-body" id="pageViews"></div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Top Search Keywords</h3></div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Keyword</th><th>Clicks</th><th>Impressions</th><th>CTR</th></tr></thead>
        <tbody id="keywordsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Visitor Geography</h3></div>
    <div class="card-body" id="geoBody"></div>
  </div>
</main>

<script>
(async function() {
  const res = await fetch('data/analytics.json');
  const data = await res.json();

  // Stats
  const totalViews = data.pageViews.reduce((s, p) => s + p.views, 0);
  const totalKeywords = data.searchKeywords.length;
  const topCountry = data.geoDistribution[0].country;
  const avgCTR = (data.searchKeywords.reduce((s, k) => s + parseFloat(k.ctr), 0) / data.searchKeywords.length).toFixed(1);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-icon blue">&#9654;</div><div class="stat-value">${(totalViews/1000).toFixed(0)}K</div><div class="stat-label">Total Page Views</div></div>
    <div class="stat-card"><div class="stat-icon green">&#9733;</div><div class="stat-value">${totalKeywords}</div><div class="stat-label">Search Keywords</div></div>
    <div class="stat-card"><div class="stat-icon purple">&#9992;</div><div class="stat-value">${topCountry}</div><div class="stat-label">Top Country</div></div>
    <div class="stat-card"><div class="stat-icon orange">&#8593;</div><div class="stat-value">${avgCTR}%</div><div class="stat-label">Avg CTR</div></div>
  `;

  // Page view bars
  const maxViews = data.pageViews[0].views;
  document.getElementById('pageViews').innerHTML = data.pageViews.map(p => {
    const pct = (p.views / maxViews * 100).toFixed(1);
    return `<div class="chart-bar">
      <span class="bar-label">${p.title}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-value">${p.views.toLocaleString()}</span>
    </div>`;
  }).join('');

  // Keywords table
  document.getElementById('keywordsBody').innerHTML = data.searchKeywords.map(k => `
    <tr><td>${k.keyword}</td><td>${k.clicks.toLocaleString()}</td><td>${k.impressions.toLocaleString()}</td><td>${k.ctr}</td></tr>
  `).join('');

  // Geo
  const maxGeo = data.geoDistribution[0].visitors;
  document.getElementById('geoBody').innerHTML = data.geoDistribution.map(g => {
    const pct = (g.visitors / maxGeo * 100).toFixed(1);
    return `<div class="chart-bar">
      <span class="bar-label">${g.country}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-value">${g.percentage}</span>
    </div>`;
  }).join('');
})();
</script>

</body>
</html>
